name: verify-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-utils-scope:
    name: ci:lint-test-utils-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify test-utils scope and production build
        run: bash scripts/ci/ci-lint-test-utils-scope.sh

  lint-traceability:
    name: ci:lint-traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run traceability lint
        run: bash scripts/ci/ci-lint-traceability.sh

  lint-prelaunch-compat:
    name: ci:lint-prelaunch-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run pre-launch compatibility lint
        run: bash scripts/ci/ci-lint-prelaunch-compat.sh

  lint-slo-profile:
    name: ci:lint-slo-profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run SLO profile lint
        run: bash scripts/ci/ci-lint-slo-profile.sh

  test-contract:
    name: ci:test-contract (${{ matrix.suite }})
    needs: [lint-test-utils-scope]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [auth, quota, idempotency, worker, diagnostics, supplychain]
    steps:
      - uses: actions/checkout@v6
      - name: Run contract suite
        run: bash scripts/ci/ci-test-contract-suite.sh "${{ matrix.suite }}"

  e2e-frontend-security:
    name: ci:e2e-frontend-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run frontend security e2e stub
        run: bash scripts/ci/ci-e2e-frontend-security.sh

  e2e-worker-protocol-fallback-a11y:
    name: ci:e2e-worker-protocol-fallback-a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run worker fallback a11y e2e stub
        run: bash scripts/ci/ci-e2e-worker-protocol-fallback-a11y.sh

  e2e-canvas-fallback-metrics:
    name: ci:e2e-canvas-fallback-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run canvas fallback metrics e2e stub
        run: bash scripts/ci/ci-e2e-canvas-fallback-metrics.sh

  test-observability:
    name: ci:test-observability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run observability contract checks
        run: bash scripts/ci/ci-test-observability.sh
