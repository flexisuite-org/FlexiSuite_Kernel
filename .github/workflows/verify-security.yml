name: verify-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_nightly:
        description: "Run nightly reliability suite"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-sql-security:
    name: ci:lint-sql-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run SQL security lint
        run: bash scripts/ci/ci-lint-sql-security.sh

  lint-manifest-trust-root:
    name: scaffold:ci:lint-manifest-trust-root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run trust root scaffold check
        run: bash scripts/ci/ci-lint-manifest-trust-root.sh

  test-manifest-break-glass:
    name: scaffold:ci:test-manifest-break-glass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run break-glass contract scaffold check
        run: bash scripts/ci/ci-test-manifest-break-glass.sh

  nightly-reliability:
    name: scaffold:nightly:test-reliability
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run nightly reliability suites
        run: bash scripts/ci/nightly-test-reliability.sh
