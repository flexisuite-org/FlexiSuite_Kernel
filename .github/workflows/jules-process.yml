name: Jules Process

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to process'
        required: true
        type: string

jobs:
  jules-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Improved checkout logic for forks and dispatch events
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr_number && format('refs/pull/{0}/head', github.event.inputs.pr_number) || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Run Jules
        uses: google-labs-code/jules-action@main
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          model: "gemini-2.0-flash-001"
          # digest_body is no longer passed; the action must fetch it logic
          pr_number: ${{ inputs.pr_number }}
