name: Jules Process

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to process'
        required: true
        type: string
      digest_body:
        description: 'Digest body content (instructions for Jules)'
        required: true
        type: string

jobs:
  jules-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.pr_number && format('refs/pull/{0}/head', github.event.inputs.pr_number) || github.ref }}

      - name: Run Jules
        uses: google-github-actions/jules-action@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          model: "gemini-2.0-flash-001" # Or appropriate model
          task: ${{ inputs.digest_body }}
          pr_number: ${{ inputs.pr_number }}
