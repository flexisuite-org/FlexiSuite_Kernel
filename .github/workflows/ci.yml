name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flexi
          POSTGRES_PASSWORD: flexi
          POSTGRES_DB: flexi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U flexi" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://flexi:flexi@localhost:5433/flexi?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: dummy-jwt-secret
      REFRESH_TOKEN_SECRET: dummy-refresh-secret
      SIGNING_SECRET: dummy-signing-secret
      GITHUB_WEBHOOK_SECRET: dummy-webhook-secret
      PORT: 9000
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5433 -U flexi; do sleep 2; done
          echo "Waiting for Redis..."
          sleep 2

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Run tests
        run: pnpm test
