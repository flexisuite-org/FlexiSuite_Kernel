version: 2

updates:
  # GitHub Actions（最優先・ノイズ少）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "ci"
    commit-message:
      prefix: "chore(deps)"

  # Rust (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    # セマンティック破壊を避ける
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # npm / pnpm / yarn（Frontendがある場合）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
