[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
url = "2.4"
form_urlencoded = "1.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
ring = "0.17"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["std", "pem"] }
# Exception (system-scoped only): KeyManager performs key lifecycle persistence.
# Tenant-scoped data access must continue to go through kernel-data TenantContext APIs.
kernel-data = { path = "../kernel-data" }
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# TODO(security): Pinned to =0.1.43 to avoid upstream regression in 0.1.44 (10MB bloat due to included test-macros).
# Tracking: https://github.com/tokio-rs/tracing/issues/3455
# Internal Tracking: https://github.com/flexisuite-org/FlexiSuite_Kernel/issues/25
tracing = "=0.1.43"
async-trait = "0.1"
regex = "1.12.3"
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
chrono = { version = "0.4.43", features = ["serde"] }

[features]
default = []
test-utils = []
