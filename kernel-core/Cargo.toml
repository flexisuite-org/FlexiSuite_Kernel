[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
url = "2.4"
form_urlencoded = "1.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
ring = "0.17"
hex = "0.4"
# Exception (system-scoped only): KeyManager performs key lifecycle persistence.
# Tenant-scoped data access must continue to go through kernel-data TenantContext APIs.
kernel-data = { path = "../kernel-data" }
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# TODO(security): Pinned to =0.1.44 due to upstream packaging regression concerns.
# Tracking: https://github.com/tokio-rs/tracing/issues/3455
# Internal Tracking: https://github.com/flexisuite-org/FlexiSuite_Kernel/issues/25
tracing = "=0.1.44"
async-trait = "0.1"
regex = "1.12.3"
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
chrono = { version = "0.4.43", features = ["serde"] }
metrics = "0.24.3"

[dev-dependencies]
kernel-data = { path = "../kernel-data", features = ["test-utils"] }
ed25519-dalek = { workspace = true }
hex = "0.4"
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }
sea-orm = { version = "1.1.20", features = ["mock"] }

[features]
default = []
test-utils = ["kernel-data/test-utils"]
