[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
url = "2.4"
form_urlencoded = "1.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v7", "serde"] }
serde_json = "1.0"

[features]
default = []
test-utils = []
