[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
url = "2.4"
form_urlencoded = "1.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.12.3"
once_cell = "1.21.3"
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
chrono = { version = "0.4.43", features = ["serde"] }

[features]
default = []
test-utils = []
