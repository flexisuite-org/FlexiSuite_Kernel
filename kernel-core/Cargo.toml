[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
url = "2.4"
form_urlencoded = "1.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
paseto = "2.0"
ring = "0.17"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
hex = "0.4"
rand = "0.8"
kernel-data = { path = "../kernel-data" }
sea-orm = { version = "1.1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
tracing = "0.1.44"

[features]
default = []
test-utils = []
