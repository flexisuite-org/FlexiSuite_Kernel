[package]
name = "kernel-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
http-body-util = "0.1"
base64 = "0.22"
ring = "0.17.14"
uuid = { version = "1", features = ["v7", "serde"] }
async-trait = "0.1"
kernel-core = { path = "../kernel-core" }
tracing = "0.1.44"
