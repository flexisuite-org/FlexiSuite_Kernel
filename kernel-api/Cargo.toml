[package]
name = "kernel-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
http = "1"
http-body-util = "0.1"
base64 = "0.22"
ring = "0.17.14"
uuid = { version = "1", features = ["v7", "serde"] }
async-trait = "0.1"
kernel-core = { path = "../kernel-core" }
kernel-data = { path = "../kernel-data" }
# TODO(security): Pinned to =0.1.44 due to upstream packaging regression concerns.
# Tracking: https://github.com/tokio-rs/tracing/issues/3455
# Internal Tracking: https://github.com/flexisuite-org/FlexiSuite_Kernel/issues/25
tracing = "=0.1.44"
rusty_paseto = { version = "=0.8.0", features = ["v4_public"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redis = { version = "1.2.1", features = ["aio", "connection-manager", "tokio-comp", "tokio-rustls-comp"] }
futures-util = "0.3"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
opentelemetry = { version = "0.31", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-prometheus = { version = "0.31", default-features = false }
prometheus = "0.14"
sysinfo = "0.30"
thiserror = "1.0"

[dev-dependencies]
temp-env = "=0.3.6"
# test-utils feature is primarily used for integration tests
kernel-data = { path = "../kernel-data", features = ["test-utils"] }
ed25519-dalek = { workspace = true }
rand = "0.10"

[features]
enable_dev_auth = ["kernel-data/enable_dev_auth"]
test-utils = ["kernel-data/test-utils"]
