[package]
name = "kernel-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
http = "1"
http-body-util = "0.1"
base64 = "0.22"
ring = "0.17.14"
uuid = { version = "1", features = ["v7", "serde"] }
async-trait = "0.1"
kernel-core = { path = "../kernel-core" }
kernel-data = { path = "../kernel-data" }
# TODO(security): Pinned to =0.1.43 to avoid upstream regression in 0.1.44 (e.g. potential deadlocks or broken spans).
# Tracking: https://github.com/tokio-rs/tracing/issues/3082 (example placeholder, will update if search finds better)
tracing = "=0.1.43"
rusty_paseto = "0.7.1"
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
opentelemetry = { version = "0.31", features = ["metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
opentelemetry-prometheus = { version = "0.31", default-features = false }
prometheus = "0.14"
sysinfo = "0.30"
