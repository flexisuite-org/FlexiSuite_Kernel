[package]
name = "gen-keys"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4.43", default-features = true }
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
hex = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"

