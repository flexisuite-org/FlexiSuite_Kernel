[package]
name = "kernel-archiver"
version = "0.1.0"
edition = "2021"

[dependencies]
kernel-data = { path = "../kernel-data" }
kernel-core = { path = "../kernel-core" }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
aws-config = "1.8.14"
aws-sdk-s3 = "1.122.0"
aws-smithy-types = "1.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1.0"
futures = "0.3"
base64 = "0.22"
