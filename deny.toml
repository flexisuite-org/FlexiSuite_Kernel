# cargo-deny configuration for FlexiSuite_Kernel
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check
# CI:  cargo deny --workspace check

[graph]
# Analyze all feature-gated dependencies so cargo-deny covers the same
# dependency surface as a production build (including optional features).
all-features = true

# ---------------------------------------------------------------------------
# [advisories] — RUSTSEC advisory database
# ---------------------------------------------------------------------------
[advisories]
# Warn on unmaintained crates; fail on vulnerabilities
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = []

# ---------------------------------------------------------------------------
# [licenses] — License policy
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# [bans] — Banned / pinned crate policy
# ---------------------------------------------------------------------------
[bans]
# Deny multiple versions of the same crate by default (keeps the dep tree lean)
multiple-versions = "deny"
wildcards = "deny"

# ---------------------------------------------------------------------------
# [sources] — Allowed crate sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
