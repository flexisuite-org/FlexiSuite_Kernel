[package]
name = "contract-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
url = "2.4"
async-trait = "0.1"
kernel-core = { path = "../../kernel-core" }
kernel-data = { path = "../../kernel-data" }
kernel-api = { path = "../../kernel-api", features = ["test-utils"] }
# TODO(security): Pinned to =0.1.43 to avoid upstream regression in 0.1.44 (10MB bloat due to included test-macros).
# Tracking: https://github.com/tokio-rs/tracing/issues/3455
# Internal Tracking: https://github.com/flexisuite-org/FlexiSuite_Kernel/issues/25
tracing = "=0.1.43"
# TODO(security): Pinned to =0.3.22 for compatibility with tracing = "=0.1.43"; upgrading tracing-subscriber
# may pull in a newer tracing API that conflicts with the pinned version.
# Tracking: https://github.com/tokio-rs/tracing/issues/3455
# Internal Tracking: https://github.com/flexisuite-org/FlexiSuite_Kernel/issues/25
tracing-subscriber = "=0.3.22"
rusty_paseto = { version = "0.8", features = ["v4_public"] }
chrono = "0.4.43"
base64 = "0.22"
ed25519-dalek = { workspace = true }
rand = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
sea-orm = { version = "1.1.19", features = ["mock", "runtime-tokio-rustls"] }
hex = "0.4"
