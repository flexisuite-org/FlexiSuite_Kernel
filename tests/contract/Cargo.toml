[package]
name = "contract-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
url = "2.4"
async-trait = "0.1"
kernel-core = { path = "../../kernel-core" }
kernel-api = { path = "../../kernel-api" }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
rusty_paseto = "0.7.2"
hex = "0.4.3"
chrono = "0.4.43"
sea-orm = { version = "1.1.19", features = ["mock", "runtime-tokio-rustls"] }
