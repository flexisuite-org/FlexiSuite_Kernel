[workspace]
resolver = "2"
members = [
    "kernel-core",
    "kernel-api",
    "tests/contract",
    "kernel-data",
    "kernel-data/migration",
    "kernel-runtime",
    "kernel-registry",
    "ops/linters",
    "kernel-archiver",
    "tools/gen-keys",
]

[workspace.dependencies]
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
