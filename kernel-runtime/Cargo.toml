[package]
name = "kernel-runtime"
version = "0.1.0"
edition = "2024" # Required for modern async and language features
rust-version = "1.85"

[dependencies]
anyhow = "1.0.101"
async-trait = "0.1.89"
base64 = "0.22"
deno_core = "0.385.0"
deno_error = "0.7.3"
libc = "0.2.183"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
url = "2.5"
wasmtime = "41.0.4"
wasmtime-wasi = "41.0.4"
