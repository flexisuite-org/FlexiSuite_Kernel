[package]
name = "kernel-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
tracing = "0.1.44"
kernel-core = { path = "../kernel-core" }

sea-orm = { version = "1.1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v7", "serde"] }
futures = "0.3.32"
ring = "0.17.14"
hex = "0.4"

[dev-dependencies]
migration = { path = "./migration" }
sea-orm-migration = "1.1.0"
tokio = { version = "1", features = ["full"] }
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres"] }

