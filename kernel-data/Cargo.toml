[package]
name = "kernel-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
# TODO(security): Pinned to =0.1.43 to avoid upstream regression in 0.1.44 (10MB bloat due to included test-macros).
# Tracking: https://github.com/tokio-rs/tracing/issues/3455
# Internal Tracking: https://github.com/flexisuite-org/FlexiSuite_Kernel/issues/25
tracing = "=0.1.44"
# kernel-core = { path = "../kernel-core" } # Removed to break cycle

sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
json-patch = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v7", "serde"] }
futures = "0.3.32"
ring = "0.17.14"
hex = "0.4"
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager", "streams"] }
moka = { version = "0.12", features = ["future"] }
twox-hash = "2.1.2"

[dev-dependencies]
migration = { path = "./migration" }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# test-only dependency for integration tests
# kernel-core = { path = "../kernel-core" } # Removed to break cycle
# Enable test-utils on self for tests
kernel-data = { path = ".", features = ["test-utils"] }

[features]
default = []
enable_dev_auth = []
test-utils = ["sea-orm/mock"]
