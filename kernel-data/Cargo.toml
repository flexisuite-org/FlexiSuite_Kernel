[package]
name = "kernel-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
tracing = "0.1.44"
# kernel-core = { path = "../kernel-core" } # Removed to break cycle

sea-orm = { version = "1.1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json-patch = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v7", "serde"] }
futures = "0.3.32"
ring = "0.17.14"
hex = "0.4"

[dev-dependencies]
migration = { path = "./migration" }
sea-orm-migration = "1.1.0"
tokio = { version = "1", features = ["full"] }
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres"] }

# Enable test-utils on kernel-core for tests (tests can depend on core, that's fine?)
# Wait, if kernel-data library code uses kernel-core, we have cycle.
# But if ONLY tests use kernel-core, it's fine IF kernel-core doesn't depend on kernel-data dev-features.
# But kernel-core depends on kernel-data.
# So kernel-data [dev-dependencies] kernel-core is also a cycle?
# Cyclic dev-dependency is allowed in Rust? No, it causes issues.
# But let's see. If I remove it from [dependencies], library cycle is broken.
kernel-core = { path = "../kernel-core", features = ["test-utils"] }
# Enable test-utils on self for tests
kernel-data = { path = ".", features = ["test-utils"] }

[features]
test-utils = []
