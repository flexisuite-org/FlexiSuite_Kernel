[package]
name = "kernel-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
object_store = "0.11"
tokio = { version = "1.32", features = ["full"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
bytes = "1.5"
kernel-core = { path = "../kernel-core" }
tracing = "=0.1.43"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
ed25519-dalek = { version = "2.1", features = ["std", "pem", "rand_core"] }
rand = "0.8"
