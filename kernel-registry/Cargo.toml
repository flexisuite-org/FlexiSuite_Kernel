[package]
name = "kernel-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
object_store = "0.11"
tokio = { version = "1.32", features = ["full"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
bytes = "1.5"
kernel-core = { path = "../kernel-core" }
tracing = "=0.1.43"
base64 = "0.22"
# Security Note: 'ring' was removed due to its experimental status, lack of public security audit,
# and documented side-channel limitations in its BoringSSL-derived Ed25519 implementation.
# It is unsuitable for kernel security boundaries without mitigations.
# Use 'ed25519-dalek' or other clearly-audited alternatives for cryptography.
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
temp-env = "=0.3.6"
rand = "0.8"
